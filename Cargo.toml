[package]
name = "grau-web"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.107", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "MouseEvent",
    "TouchEvent",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "HtmlButtonElement",
    "HtmlSpanElement",
    "CssStyleDeclaration",
    "Node",
    "EventTarget",
    "Event",
    "KeyboardEventInit",
    "MouseEventInit",
    "TouchEventInit",
    "Touch",
    "TouchInit",
    "TouchList",
    "console",
    "Performance",
    "HtmlElement",
    "WebGlVertexArrayObject",
    "HtmlCanvasElement",
    "AudioParam",
    "GainNode",
    "AudioDestinationNode",
    "AudioScheduledSourceNode",
    "AudioNode",
    "AudioContextOptions",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "OscillatorNode",
    "OscillatorOptions",
    "PeriodicWave",
    "PeriodicWaveConstraints",
    "AudioWorkletNode",
    "AudioWorkletProcessor",
    "AudioWorkletGlobalScope",
    "AudioWorklet",
    "GainOptions",
    "OscillatorType",
    "DomRect",
    "DomRectReadOnly",
    "Storage",
    "Location",
] }
nalgebra = { version = "0.32", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1