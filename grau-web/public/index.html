<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grau - Motorcycle Wheelie Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a; color: #fff; overflow: hidden;
            width: 100vw; height: 100vh;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0a0a; z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 50px; height: 50px; border: 4px solid rgba(255,100,100,0.2);
            border-top-color: #ff6464; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; color: rgba(255,255,255,0.8); }
        #console-log {
            position: fixed; top: 0; left: 0; right: 0; max-height: 300px;
            overflow-y: auto; background: rgba(0,0,0,0.9); color: #88ff88;
            font-family: monospace; font-size: 11px; padding: 8px; z-index: 10001;
            white-space: pre-wrap; border-bottom: 1px solid #333;
        }
        #error-log {
            position: fixed; bottom: 0; left: 0; right: 0; max-height: 200px;
            overflow-y: auto; background: rgba(255,0,0,0.2); color: #ffaaaa;
            font-family: monospace; font-size: 12px; padding: 10px; z-index: 10000;
            display: none; white-space: pre-wrap;
        }
        .hud {
            position: fixed; top: 320px; left: 20px; right: 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; z-index: 100; pointer-events: none;
        }
        .hud-panel {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(20,20,20,0.9));
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 12px 16px; display: flex; flex-direction: column;
            align-items: center; gap: 4px;
        }
        .hud-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.6); }
        .hud-value { font-size: 28px; font-weight: 700; font-family: monospace; color: #ff6464; }
        .hud-unit { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .hud-sub { font-size: 11px; color: rgba(255,255,255,0.5); }
        .hud-sub span { color: #ffaa44; font-weight: 600; }
        .input-indicators {
            position: fixed; bottom: 20px; left: 20px;
            display: flex; gap: 20px; align-items: flex-end; z-index: 100; pointer-events: none;
        }
        .indicator-panel {
            display: flex; gap: 16px;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(20,20,20,0.9));
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px;
        }
        .indicator { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .indicator-label { font-size: 9px; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,0.5); }
        .vertical-bar { width: 20px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: flex-end; overflow: hidden; }
        .vertical-bar-fill { width: 100%; height: 0%; background: linear-gradient(to top, #44ff44, #ffaa44, #ff4444); border-radius: 10px; }
        .horizontal-bar { width: 100px; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; position: relative; overflow: hidden; }
        .horizontal-bar-fill { position: absolute; left: 50%; top: 0; width: 20px; height: 100%; background: #44aaff; border-radius: 10px; transform: translateX(0%); }
        .status-indicators { display: flex; gap: 10px; }
        .status-indicator { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .status-indicator.active { background: #ff6464; color: #fff; }
        .status-indicator.inactive { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); }
        .help-overlay {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.9); z-index: 200; transition: opacity 0.3s;
        }
        .help-overlay.hidden { opacity: 0; pointer-events: none; }
        .help-content {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 40px; max-width: 600px; text-align: center;
        }
        .help-content h2 { margin-bottom: 24px; color: #ff6464; }
        .control-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .control { font-size: 14px; color: rgba(255,255,255,0.8); }
        kbd { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 2px 8px; font-family: monospace; font-size: 12px; }
        .mobile-hint { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 20px; }
        .btn { background: #ff6464; color: #fff; border: none; padding: 12px 32px; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div id="console-log"></div>
    <div id="loading">
        <div class="loader"></div>
        <div id="loading-text" class="loading-text">Carregando Grau...</div>
    </div>
    <div id="error-log"></div>
    <canvas id="game-canvas"></canvas>

    <script type="module">
        // Intercept console.log to show on screen
        const consoleLog = document.getElementById('console-log');
        const origLog = console.log;
        const origError = console.error;
        const origWarn = console.warn;
        
        function addLog(msg, type) {
            const div = document.createElement('div');
            div.textContent = `[${type}] ${msg}`;
            div.style.color = type === 'ERROR' ? '#ff8888' : type === 'WARN' ? '#ffcc88' : '#88ff88';
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
            // Keep only last 50 entries
            while (consoleLog.children.length > 50) consoleLog.removeChild(consoleLog.firstChild);
        }
        
        console.log = (...args) => { origLog(...args); addLog(args.join(' '), 'LOG'); };
        console.error = (...args) => { origError(...args); addLog(args.join(' '), 'ERROR'); };
        console.warn = (...args) => { origWarn(...args); addLog(args.join(' '), 'WARN'); };
        
        const errorLog = document.getElementById('error-log');
        function showError(msg) {
            errorLog.style.display = 'block';
            errorLog.textContent += msg + '\n';
            origError(msg);
        }
        window.addEventListener('error', (e) => showError('JS Error: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno));
        window.addEventListener('unhandledrejection', (e) => showError('Promise Rejection: ' + (e.reason?.message || e.reason?.stack || e.reason)));

        console.log('Page loaded, importing WASM module...');
        
        import init, { main } from './grau_web.js';

        async function run() {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');

            try {
                loadingText.textContent = 'Carregando WASM...';
                console.log('Fetching WASM...');
                await init();
                console.log('WASM initialized!');
                loadingText.textContent = 'Iniciando jogo...';
                console.log('Calling main()...');
                main();
                console.log('main() returned!');
                
                loading.classList.add('hidden');
                setTimeout(() => { loading.style.display = 'none'; }, 500);
            } catch (e) {
                console.error('FATAL:', e.message || e.stack || e);
                loadingText.textContent = 'Erro: ' + (e.message || e);
                loadingText.style.color = '#ff4444';
            }
        }

        run();
    </script>
</body>
</html>
